    before: "It's also a genuine foot in the door. Maybe you love this work and want to do it for years — that's a great outcome. Maybe you use it as a springboard instead: into a different role here as we grow, or out into the wider open-science community, where you'll have spent a couple of years meeting most of the people who run it. That's a great outcome too, and we'll help you get there."
