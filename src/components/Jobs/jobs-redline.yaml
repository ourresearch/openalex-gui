    after: "What you won't own: engineering, the back-office functions (finance, HR, taxes, legal) that stay with our CEO and COO, and sales — you'll be involved, since you hold the relationship, but deal-making and sales paperwork aren't yours. This role has a clear edge to it."
    comment: "This paragraph is great, and it's the right place for the sales boundary (moved out of the bullets, R5): they WILL be involved in sales since they hold the relationship, but it's not a sales role. Phrasing doesn't have to be perfect — that's the idea to capture."
