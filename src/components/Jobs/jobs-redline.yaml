    page: community-lead
    section: the-role
    author: jason
    date: 2026-08-20
    status: accepted
    before: "The honest headline: you'll own our relationships with users and members. The people who use OpenAlex every day, and the institutions whose support keeps it running."
    after: "You'll own our relationships with users and members: the people who use OpenAlex every day, and the institutions whose support keeps it running."
    comment: "Dropped the 'honest headline' preamble — that's Claude-speak and unnecessary. No bold needed either: since it's first, it'll get plenty of attention."
