    comment: "'A leader, an evangelist, an organizer' is a really strong list of three — end the paragraph on that strong note. No need to get into promises."
  - id: R11
    page: community-lead
    section: the-role
    author: jason
    date: 2026-08-20
    status: accepted
    before: "Community work has a reputation as the soft side of the org chart — the place where effort is the product, where a full calendar of well-attended webinars counts as a good quarter. Not here. Results in this job look like a community that's measurably bigger, warmer, and more committed: the member who was drifting away renews because you heard what was actually bothering them and fixed it; the advisory board meeting that used to be a status readout produces a decision; the conference talk turns into three new member conversations because you followed up the same day — not a longer list of things you did."
    context: "a leader, an evangelist, an organizer."
    comment: "Feels like it's embroidering stuff we already said."
  - id: R12
    page: community-lead
    section: the-role
    author: jason
    date: 2026-08-20
    status: accepted
    before: "And in this job, patience is resourcefulness. Relationships compound the way ideas do: slowly, then suddenly. Staying warm with a member who's being difficult, following up in month six of a conversation that won't pay off until next year — that's not the opposite of moving fast; it's how this kind of work gets results. You like people, including difficult ones. This job is 90% people."
    context: "a leader, an evangelist, an organizer."
    comment: "Same as R11 — trimming for length; the section already carries this."
  - id: R13
    page: community-lead
    section: about-you
    author: jason
    date: 2026-08-20
    status: accepted
    before: "You write and speak in a way people remember — enthusiasm that's contagious rather than exhausting."
    after: "You're a clear, enthusiastic, compelling writer and speaker."
    comment: "'Enthusiasm that's contagious rather than exhausting' was weirdly focused on one narrow part of being a good writer and speaker — went more generic."
  - id: R14
    page: community-lead
    section: about-you
    author: jason
    date: 2026-08-20
    status: accepted
    before: "You're comfortable when a relationship has money in it. We're a nonprofit building open infrastructure, and our members' and partners' contributions are what keep that infrastructure running and open to everyone. You don't need to have carried a quota, but you can talk with a library director about renewing without flinching or apologizing for asking."
    after: "You're comfortable when a relationship has money in it. This isn't a sales role, but we are always hustling; paid services keep our nonprofit alive."
    comment: "Shortened, and linked 'paid services' to the pricing page. (First bullet: longer than I'd like but it's doing a lot of work, keeping it. Second bullet: great.)"
