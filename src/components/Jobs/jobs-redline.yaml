  - id: R6
    page: community-lead
    section: the-role
    author: jason
    date: 2026-08-20
    status: accepted
    before: "Running the machinery"
    after: "Run the machinery"
    comment: "Verb tweak so the bullets follow 'That means you will:'."
  - id: R7
    page: community-lead
    section: the-role
    author: jason
    date: 2026-08-20
    status: accepted
    before: "Helping users directly. Our support queue is shared with the tech team, because the person who answers the hard question is often the person who understands the community best."
    after: "Help users directly. Our support queue is shared with the tech team; answering real users' questions is how you stay close to what the community actually needs."
