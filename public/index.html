<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">



    <title>OpenAlex</title>
    
    <!-- Suppress ResizeObserver loop errors (benign timing issue with Vuetify menus) -->
    <script>
      // Suppress console errors for ResizeObserver
      const originalError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('ResizeObserver loop')) {
          return;
        }
        originalError.apply(console, args);
      };
      
      // Suppress window errors for ResizeObserver
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('ResizeObserver loop')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return false;
        }
      }, true);
    </script>
    
    <!-- Warm the TCP+TLS handshakes the app needs on every boot (oxjob #860):
         curl measured DNS+connect+TLS to user.openalex.org at 160-250 ms, paid
         only after the JS bundle had executed. With these the first
         /users/me, /works query and corrections fetch reuse open sockets. -->
    <link rel="preconnect" href="https://user.openalex.org" crossorigin>
    <link rel="preconnect" href="https://api.openalex.org" crossorigin>
    <link rel="preconnect" href="https://corrections.openalex.org" crossorigin>
    <link rel="dns-prefetch" href="https://user.openalex.org">
    <link rel="dns-prefetch" href="https://api.openalex.org">
    <link rel="dns-prefetch" href="https://corrections.openalex.org">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Plausible.io -->
    <script defer data-domain="openalex.org" src="https://plausible.io/js/script.file-downloads.outbound-links.pageview-props.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>


    <link rel="icon" href="<%= BASE_URL %>tricon-outlined.png" type="image/png">

    <!-- Cloudflare Turnstile (oxjob #252 Phase 4): invisible CAPTCHA on signup. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

    <!-- Google Fonts stylesheet LAST in <head> (oxjob #860): an inline <script>
         that follows a pending stylesheet must wait for it (CSSOM rule), which
         parser-blocked the body — the boot skeleton — for ~1 s on a cold load
         while fonts.googleapis.com answered. Nothing inline may come after this. -->
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
</noscript>
<!-- Boot skeleton (oxjob #860): a plain-HTML copy of the 56px site top bar so a
     cold visitor sees the site chrome while the JS bundle downloads, instead of a
     white page. Lives OUTSIDE #app (app.mount replaces #app's content) and sits
     over the empty <v-app>; App.vue removes it the moment the real chrome
     resolves (the real bar is in-flow at the same geometry, so no shift). Auth
     pages use the 'bare' chrome, so the inline script drops it there up front.
     Keep in sync with .site-top-bar / .site-top-bar-inner in SiteTopBar.vue. -->
<style>
  #boot-skeleton { position: absolute; top: 0; left: 0; right: 0; z-index: 1003; background: #fff; border-bottom: 0.5px solid rgba(0, 0, 0, 0.12); }
  #boot-skeleton > div { display: flex; align-items: center; max-width: 1280px; margin: 0 auto; height: 56px; padding: 0 40px; }
  #boot-skeleton img { height: 26px; display: block; }
  @media (max-width: 700px) { #boot-skeleton > div { padding: 0 16px; } }
</style>
<div id="boot-skeleton" aria-hidden="true"><div><img src="/brand-assets/openalex-lockup.png" alt=""></div></div>
<script>if (/^\/(login|signup)(\/|$)/.test(location.pathname)) document.getElementById('boot-skeleton').remove();</script>
<div id="app"></div>
<!-- built files will be auto injected -->

<!-- Start of openalex Zendesk Widget script -->
<script id="ze-snippet" src="https://static.zdassets.com/ekr/snippet.js?key=f448c93c-e2e1-4d7c-b344-683a586e69f7"> </script>
<script>
    // Zendesk Widget Setup
    window.zE = window.zE || function() { (zE.q = zE.q || []).push(arguments); };
    // Wait for the widget to load before setting user details
    zE('webWidget:on', 'open', function() {
        zE('webWidget', 'identify', {
        name: vm.$store.state.user.name, 
        email: vm.$store.state.user.email,
        });
    });
    zE('webWidget', 'updateSettings', {
        webWidget: {
            contactForm: {
                attachments: false,
                title: { '*': "Send us Feedback"},
            }
        }
    });   
 </script>
 <!-- End of openalex Zendesk Widget script -->

</body>
</html>
